<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visuals | Teen Graphic Design Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- APP HEADER -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg">V</div>
      <div>
        <h1 class="font-bold text-base leading-none text-white">Visuals</h1>
        <p class="text-[10px] text-purple-400 font-medium">By Crea Teen Studio</p>
      </div>
    </div>
    <a href="mailto:contact@createen.com" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-full font-medium transition-all shadow-md">
      Hire Us
    </a>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-xl w-full mx-auto p-4 flex-grow space-y-6">

    <!-- VIEW 1: MARKETPLACE -->
    <section id="view-marketplace" class="space-y-4">
      <!-- Search & Filters -->
      <div class="space-y-2">
        <h2 class="text-xl font-bold text-white">Design Assets & Kits</h2>
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
          <button onclick="filterCategory('All')" class="cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-full whitespace-nowrap font-medium">All</button>
          <button onclick="filterCategory('Packaging')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-700">Packaging</button>
          <button onclick="filterCategory('Logos')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-700">Logos</button>
          <button onclick="filterCategory('Social')" class="cat-btn bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-700">Social Media</button>
        </div>
      </div>

      <!-- Asset Grid -->
      <div id="asset-grid" class="grid grid-cols-1 gap-4">
        <!-- Dynamic Cards Inserted Here -->
      </div>
    </section>

    <!-- VIEW 2: ESTIMATOR -->
    <section id="view-estimator" class="hidden space-y-4">
      <div class="border-b border-slate-800 pb-2">
        <h2 class="text-xl font-bold text-white">Project Quote Calculator</h2>
        <p class="text-xs text-slate-400">Calculate estimated costs for custom design work instantly.</p>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Select Design Package</label>
          <select id="pkg-select" onchange="calculateQuote()" class="w-full bg-slate-950 border border-slate-800 text-sm rounded-lg p-2.5 text-slate-200">
            <option value="45">Logo & Typography ($45)</option>
            <option value="75">Social Media Brand Kit ($75)</option>
            <option value="110">Full Cosmetic Packaging Design ($110)</option>
          </select>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-300">Add-on Services</label>
          <label class="flex items-center justify-between p-2 bg-slate-950 rounded-lg border border-slate-800 text-xs">
            <span>Express 24-Hour Turnaround (+$25)</span>
            <input type="checkbox" id="addon-express" onchange="calculateQuote()" class="accent-indigo-500 w-4 h-4">
          </label>
          <label class="flex items-center justify-between p-2 bg-slate-950 rounded-lg border border-slate-800 text-xs">
            <span>Vector Source Files (.AI, .SVG) (+$15)</span>
            <input type="checkbox" id="addon-vector" onchange="calculateQuote()" class="accent-indigo-500 w-4 h-4">
          </label>
        </div>

        <div class="border-t border-slate-800 pt-3 flex items-center justify-between">
          <span class="text-xs text-slate-400">Estimated Total:</span>
          <span id="quote-total" class="text-2xl font-black text-indigo-400">$45</span>
        </div>

        <button onclick="alert('Quote saved! Contact contact@createen.com to initiate your project.')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition-all">
          Book Design Project
        </button>
      </div>
    </section>

  </main>

  <!-- NAVIGATION BAR -->
  <nav class="sticky bottom-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2 flex justify-around text-slate-400 text-xs">
    <button onclick="switchTab('marketplace')" id="nav-marketplace" class="flex flex-col items-center gap-1 text-indigo-400">
      <i data-lucide="grid" class="w-5 h-5"></i>
      <span>Store</span>
    </button>
    <button onclick="switchTab('estimator')" id="nav-estimator" class="flex flex-col items-center gap-1 hover:text-slate-200">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span>Estimator</span>
    </button>
  </nav>

  <script>
    lucide.createIcons();

    const assets = [
      { id: 1, title: 'Sweet Thing Skincare Box', cat: 'Packaging', price: 35, img: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500' },
      { id: 2, title: 'Glow Aesthetics Logo', cat: 'Logos', price: 25, img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500' },
      { id: 3, title: 'Pastel Social Media Kit', cat: 'Social', price: 30, img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500' }
    ];

    function renderAssets(items) {
      const grid = document.getElementById('asset-grid');
      grid.innerHTML = items.map(item => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
          <img src="${item.img}" class="w-full h-40 object-cover" alt="${item.title}" />
          <div class="p-3 flex items-center justify-between">
            <div>
              <h3 class="font-semibold text-sm text-white">${item.title}</h3>
              <p class="text-[11px] text-slate-400">${item.cat}</p>
            </div>
            <div class="text-right">
              <span class="font-bold text-sm text-indigo-400">$${item.price}</span>
              <button onclick="alert('Item purchased!')" class="block mt-1 text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded">Buy</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      if(cat === 'All') renderAssets(assets);
      else renderAssets(assets.filter(a => a.cat === cat));
    }

    function switchTab(tab) {
      document.getElementById('view-marketplace').classList.toggle('hidden', tab !== 'marketplace');
      document.getElementById('view-estimator').classList.toggle('hidden', tab !== 'estimator');
      document.getElementById('nav-marketplace').className = `flex flex-col items-center gap-1 ${tab === 'marketplace' ? 'text-indigo-400' : 'text-slate-400'}`;
      document.getElementById('nav-estimator').className = `flex flex-col items-center gap-1 ${tab === 'estimator' ? 'text-indigo-400' : 'text-slate-400'}`;
    }

    function calculateQuote() {
      let base = parseInt(document.getElementById('pkg-select').value);
      if(document.getElementById('addon-express').checked) base += 25;
      if(document.getElementById('addon-vector').checked) base += 15;
      document.getElementById('quote-total').innerText = '$' + base;
    }

    renderAssets(assets);
  </script>
</body>
</html>
